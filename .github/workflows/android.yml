name: Android Build Lib

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug
      run: ./gradlew assembleDebug

    - name: Build Release
      run: ./gradlew assembleRelease

    - name: Upload Debug Libraries
      uses: actions/upload-artifact@v4
      with:
        name: libtool-debug
        path: out/debug/**/*.so

    - name: Upload Release Libraries
      uses: actions/upload-artifact@v4
      with:
        name: libtool-release
        path: out/release/**/*.so
